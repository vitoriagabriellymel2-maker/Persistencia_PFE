<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Localização | Atividade PFE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">

    <header class="cabecalho">
      <h1>Minha Localização</h1>
      <p class="subtitulo">Captura, exibição e persistência de coordenadas com localStorage</p>
    </header>

    <section class="cartao-localizacao">

      <div class="linha-info">
        <span class="rotulo">Status</span>
        <span class="status" id="status-satelite">
          <span class="bolinha" id="bolinha-status"></span>
          <span id="texto-status">Sem localização</span>
        </span>
      </div>

      <div class="coordenadas" id="coordenadas">
        <div class="coord-item">
          <span class="coord-rotulo">Latitude</span>
          <span class="coord-valor" id="valor-lat">—</span>
        </div>
        <div class="coord-item">
          <span class="coord-rotulo">Longitude</span>
          <span class="coord-valor" id="valor-lon">—</span>
        </div>
      </div>

      <p class="legenda-info" id="legenda-info">Nenhuma localização salva ainda.</p>

      <button id="btn-capturar" class="botao-principal">
        📍 Capturar minha localização
      </button>

      <p class="mensagem-erro" id="mensagem-erro"></p>

    </section>

    <section class="cartao-drag">
      <p class="titulo-drag">Limpar dados salvos</p>
      <p class="instrucao-drag">Arraste o papel até a lixeira para apagar a localização salva</p>

      <div class="campo-drag">
        <div class="item-papel" id="item-papel" draggable="true">📄</div>
        <div class="zona-lixeira" id="zona-lixeira">🗑️</div>
      </div>
    </section>

  </div>

  <script src="js/index.js"></script>
</body>
</html>
